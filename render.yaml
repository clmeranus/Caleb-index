# Render Blueprint: https://render.com/docs/blueprint-spec
# In the Render dashboard choose New > Blueprint and pick this repository.
services:
  - type: web
    name: caleb-index
    runtime: node
    # The database lives on a persistent disk, which Render only offers on paid
    # instance types. On the free type every deploy or restart would erase it.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/calebs.db
      - key: COOKIE_SECURE
        value: "1"
      # Render's proxies append two entries to X-Forwarded-For.
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: VOUCHES_REQUIRED
        value: "2"
      # Render asks for these when you create the Blueprint.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
