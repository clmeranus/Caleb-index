# Gives the Fly.io app public IP addresses if it has none, then checks the site loads.
# Run it from the repository's Actions tab ("Run workflow"). It needs a Fly access
# token stored as the repository secret FLY_API_TOKEN.
name: Fly IP addresses

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ips:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: caleb-index
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Current IP addresses
        run: flyctl ips list -a "$APP"

      - name: Add any missing addresses
        run: |
          ips="$(flyctl ips list -a "$APP")"
          # The shared IPv4 address is free; a dedicated one is billed.
          if ! grep -qw v4 <<<"$ips"; then flyctl ips allocate-v4 --shared -a "$APP"; fi
          if ! grep -qw v6 <<<"$ips"; then flyctl ips allocate-v6 -a "$APP"; fi
          flyctl ips list -a "$APP"

      - name: Check the site responds
        run: |
          # New addresses can take a minute or two to start answering.
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "https://$APP.fly.dev/healthz"; then
              echo "https://$APP.fly.dev is up."
              exit 0
            fi
            sleep 10
          done
          echo "https://$APP.fly.dev did not respond within 5 minutes."
          exit 1
