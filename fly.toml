# fly.toml app configuration file generated for caleb-index on 2026-10-23T00:42:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'caleb-index'
primary_region = 'ord'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]

[env]
  PORT = '8080'
  DATABASE_PATH = '/data/calebs.db'
  COOKIE_SECURE = '1'
  # Fly's proxy sets this header to the visitor's address.
  CLIENT_IP_HEADER = 'Fly-Client-IP'
  VOUCHES_REQUIRED = '2'

# The SQLite database lives on this volume so it survives deploys and restarts.
# A volume belongs to one machine, so the app must run as a single machine.
[mounts]
  source = 'caleb_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
