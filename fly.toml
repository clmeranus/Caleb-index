# fly.toml app configuration file generated for caleb-index on 2026-10-24T00:30:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'caleb-index'
primary_region = 'ord'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]

[env]
  CLIENT_IP_HEADER = 'Fly-Client-IP'
  COOKIE_SECURE = '1'
  DATABASE_PATH = '/data/calebs.db'
  PORT = '8080'
  PUBLIC_URL = 'https://caleb-index.fly.dev'
  VOUCHES_REQUIRED = '2'

[[mounts]]
  source = 'caleb_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
