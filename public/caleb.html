<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caleb · The Caleb Index</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="/">The <span>Caleb</span> Index</a>
      <nav class="site" id="nav"></nav>
    </div>
  </header>

  <main class="wrap" id="main"><p class="note">Loading…</p></main>

  <footer class="site"><div class="wrap">The Caleb Index · A members-only register of people named Caleb.</div></footer>

  <script src="/common.js"></script>
  <script>
    const main = document.getElementById('main');
    const number = Number(new URLSearchParams(location.search).get('n'));

    function render(c, me) {
      document.title = `${fullName(c)} · ${calebNumber(c.number)} · The Caleb Index`;
      const rows = [
        ['Location', place(c)],
        ['Born', c.birth_year],
        ['Occupation', c.occupation],
        ['Website', c.website && el('a', { href: c.website, rel: 'nofollow noopener ugc', target: '_blank' }, c.website)],
        ['Verified', new Date(c.created_at).toLocaleDateString(undefined, { dateStyle: 'long' })],
      ].filter(([, v]) => v);
      const status = el('div');
      const isMe = me.number === c.number;

      main.replaceChildren(
        el('article', { class: 'profile' },
          el('span', { class: 'badge' }, calebNumber(c.number)),
          c.is_admin ? el('span', { class: 'badge admin' }, 'Admin') : '',
          el('h1', { style: 'margin-top:12px' }, fullName(c)),
          c.bio && el('p', { class: 'bio' }, c.bio),
          el('dl', {}, rows.flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, v)])),
          el('div', { class: 'actions' },
            el('a', { href: '/' }, '← Back to the Index'),
            isMe && el('a', { href: '/account' }, 'Edit your listing'),
            isAdmin(me) && !isMe && !c.is_owner &&
              el('button', { class: 'link danger', type: 'button', onclick: () => removeEntry(c, status) }, 'Remove from the Index')
          ),
          isAdmin(me) && !isMe && !c.is_owner && adminToggle(c, status),
          status
        )
      );
    }

    // Only admins see this, and only on other members' profiles.
    function adminToggle(c, status) {
      const box = el('input', { type: 'checkbox', id: 'is-admin' });
      box.checked = Boolean(c.is_admin);
      box.addEventListener('change', async () => {
        const want = box.checked;
        const verb = want ? 'Give' : 'Remove';
        if (!confirm(`${verb} admin permission ${want ? 'to' : 'from'} ${fullName(c)}?`)) {
          box.checked = !want;
          return;
        }
        box.disabled = true;
        try {
          const res = await api(`/api/calebs/${c.number}/admin`, { method: 'PUT', body: { admin: want } });
          render({ ...c, is_admin: res.is_admin }, me);
          document.getElementById('main').querySelector('.profile').append(
            noticeBox(res.is_admin ? `${fullName(c)} is now an admin.` : `${fullName(c)} is no longer an admin.`));
        } catch (err) {
          box.checked = !want;
          box.disabled = false;
          status.replaceChildren(errorBox(err));
        }
      });
      return el('div', { class: 'admin-toggle panel' },
        box,
        el('label', { for: 'is-admin' },
          el('strong', {}, 'Admin permission'),
          el('div', { class: 'hint' }, 'Admins can review and verify new members, remove members, and give or remove admin permission.'))
      );
    }

    async function removeEntry(c, status) {
      if (!confirm(`Remove ${fullName(c)} and their account? This cannot be undone.`)) return;
      try {
        await api(`/api/calebs/${c.number}`, { method: 'DELETE' });
        main.replaceChildren(el('p', { class: 'note' }, 'The entry has been removed. ', el('a', { href: '/' }, 'Back to the Index')));
      } catch (err) {
        status.replaceChildren(errorBox(err));
      }
    }

    let me;
    initNav('/caleb').then(async (member) => {
      me = member;
      if (!me) return (location.href = '/login');
      try {
        render(await api(`/api/calebs/${number}`), me);
      } catch {
        main.replaceChildren(
          el('h1', {}, 'Caleb not found'),
          el('p', { class: 'note' }, 'There is no Caleb with that number. ', el('a', { href: '/' }, 'Back to the Index'))
        );
      }
    });
  </script>
</body>
</html>
