<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your account · The Caleb Index</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="/">The <span>Caleb</span> Index</a>
      <nav class="site" id="nav"></nav>
    </div>
  </header>

  <main class="wrap" id="main"><p class="note">Loading…</p></main>

  <footer class="site"><div class="wrap">The Caleb Index · A members-only register of people named Caleb.</div></footer>

  <script src="/common.js"></script>
  <script>
    const main = document.getElementById('main');

    function profileSection(m) {
      const out = el('div');
      const form = el('form', { class: 'register', novalidate: true }, ...profileFields(m), out,
        el('div', {}, el('button', { class: 'btn', type: 'submit' }, m.number ? 'Save listing' : 'Create listing')));
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const { member } = await api('/api/me', { method: 'PATCH', body: Object.fromEntries(new FormData(form)) });
          if (member.number && !m.number) {
            // A brand-new listing: show the account page again with its Caleb Number.
            render(member, `You're in the Index as ${calebNumber(member.number)}.`);
            window.scrollTo(0, 0);
            return;
          }
          out.replaceChildren(
            noticeBox('Your listing has been saved.'),
            member.postal_code && !member.has_location
              ? el('p', { class: 'hint warn' }, `We couldn't find the location of ${member.postal_code}, so Calebs near you won't work with it. Distance search works with US ZIP codes for now.`)
              : ''
          );
        } catch (err) {
          out.replaceChildren(errorBox(err));
        }
      });
      return form;
    }

    function emailSection(m) {
      const out = el('div');
      const status = el('div');
      const optIn = el('input', { type: 'checkbox', id: 'email_opt_in' });
      optIn.checked = Boolean(m.email_opt_in);
      const emailInput = el('input', { id: 'email', name: 'email', type: 'email', value: m.email || '', maxlength: 254, autocomplete: 'email', placeholder: 'you@example.com' });

      const showStatus = (member) => {
        let text = '';
        let resend = false;
        if (!member.email) text = 'No email saved.';
        else if (!member.email_opt_in) text = 'Saved. You won’t get email notifications.';
        else if (member.email_confirmed) text = 'Confirmed. You’ll get email notifications.';
        else {
          text = member.email_available
            ? 'Waiting for you to confirm: check your inbox for a link.'
            : 'Saved. Email isn’t set up on the site yet, so we’ll send your confirmation link once it is.';
          resend = member.email_available;
        }
        status.replaceChildren(el('p', { class: 'hint', style: 'margin:0' }, text, ' ',
          resend ? el('button', { class: 'link', type: 'button', onclick: resendConfirmation }, 'Send the link again') : ''));
      };

      async function resendConfirmation() {
        try {
          await api('/api/me/email/confirmation', { method: 'POST' });
          out.replaceChildren(noticeBox(`We sent a new confirmation link to ${emailInput.value}.`));
        } catch (err) {
          out.replaceChildren(errorBox(err));
        }
      }

      const form = el('form', { class: 'register' },
        el('div', { class: 'field' },
          el('label', { for: 'email' }, 'Email'),
          emailInput,
          el('div', { class: 'hint' }, 'Private: only you can see it.')),
        el('div', { class: 'check' },
          optIn,
          el('label', { for: 'email_opt_in' },
            el('strong', {}, 'Opt in to email notifications'),
            el('div', { class: 'hint' }, 'Get notifications from the admins by email. We’ll send a link to confirm your address first, and every email has an unsubscribe link.'))),
        status,
        out,
        el('div', {}, el('button', { class: 'btn', type: 'submit' }, 'Save email settings')));
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const { member, confirmation } = await api('/api/me/email', { method: 'PUT', body: { email: emailInput.value, opt_in: optIn.checked } });
          optIn.checked = Boolean(member.email_opt_in);
          showStatus(member);
          out.replaceChildren(noticeBox(confirmation === 'sent'
            ? `Saved. We sent a confirmation link to ${member.email}. Click it to start getting email notifications.`
            : 'Your email settings have been saved.'));
        } catch (err) {
          out.replaceChildren(errorBox(err));
        }
      });
      showStatus(m);
      return form;
    }

    function passwordSection() {
      const out = el('div');
      const form = el('form', { class: 'register' },
        el('div', { class: 'field' },
          el('label', { for: 'current_password' }, 'Current password'),
          el('input', { id: 'current_password', name: 'current_password', type: 'password', required: true, autocomplete: 'current-password' })),
        el('div', { class: 'row' },
          el('div', { class: 'field' },
            el('label', { for: 'new_password' }, 'New password'),
            el('input', { id: 'new_password', name: 'new_password', type: 'password', required: true, minlength: 10, autocomplete: 'new-password' })),
          el('div', { class: 'field' },
            el('label', { for: 'new_password_confirm' }, 'Confirm new password'),
            el('input', { id: 'new_password_confirm', name: 'new_password_confirm', type: 'password', required: true, autocomplete: 'new-password' }))),
        out,
        el('div', {}, el('button', { class: 'btn', type: 'submit' }, 'Change password')));
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const { new_password_confirm, ...body } = Object.fromEntries(new FormData(form));
        if (body.new_password !== new_password_confirm) {
          out.replaceChildren(errorBox(new Error('The two new passwords do not match.')));
          return;
        }
        try {
          await api('/api/me/password', { method: 'POST', body });
          form.reset();
          out.replaceChildren(noticeBox('Password changed. Any other devices have been logged out.'));
        } catch (err) {
          out.replaceChildren(errorBox(err));
        }
      });
      return form;
    }

    function deleteSection() {
      const out = el('div');
      const form = el('form', { class: 'register' },
        el('p', { class: 'hint', style: 'margin:0' }, 'This permanently removes your account and listing. Your Caleb Number will not be reissued.'),
        el('div', { class: 'field' },
          el('label', { for: 'delete_password' }, 'Confirm with your password'),
          el('input', { id: 'delete_password', name: 'password', type: 'password', required: true, autocomplete: 'current-password' })),
        out,
        el('div', {}, el('button', { class: 'btn danger', type: 'submit' }, 'Delete my account')));
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!confirm('Delete your account permanently?')) return;
        try {
          await api('/api/me', { method: 'DELETE', body: Object.fromEntries(new FormData(form)) });
          location.href = '/login';
        } catch (err) {
          out.replaceChildren(errorBox(err));
        }
      });
      return form;
    }

    function render(m, notice) {
      main.replaceChildren(...[
        notice && noticeBox(notice),
        el('h1', {}, 'Your account'),
        el('p', { class: 'lede' },
          `Logged in as ${m.username}. `,
          m.number && el('a', { href: `/caleb?n=${m.number}` }, `View your listing (${calebNumber(m.number)})`)),
        m.number
          ? [el('h2', {}, 'Your listing'), profileSection(m)]
          : [
              el('h2', {}, 'Create your listing'),
              el('p', { class: 'hint' }, 'Your account doesn’t have a Caleb listing yet. Add one to appear in the Index with the next Caleb Number.'),
              profileSection(m),
            ],
        el('h2', {}, 'Email'),
        emailSection(m),
        el('h2', {}, 'Password'),
        passwordSection(),
        m.role !== 'owner' && [el('h2', {}, 'Delete account'), deleteSection()],
      ].flat().filter(Boolean));
    }

    initNav('/account').then((m) => (m ? render(m) : (location.href = '/login')));
  </script>
</body>
</html>
